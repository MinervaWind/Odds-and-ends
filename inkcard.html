<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 文字转长图工具 v1.3.0 -->
  <!-- 功能：Markdown渲染 · 单回车换行 · 角色色板 · 备注板块 · 浅色/暗色主题 · 导出PNG长图 · 手机响应式 -->
  <!-- 更新：v1.3.0 - 手机端响应式（tab切换编辑/预览，底部固定生成按钮） -->
  <title>文字转长图 v1.3.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ui-bg: #F5F3EF;
      --ui-surface: #FFFFFF;
      --ui-border: #DDD9D0;
      --ui-text: #2C2416;
      --ui-text-muted: #7A7060;
      --ui-accent: #8A9BAD;
      --ui-radius: 8px;
      --ui-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--ui-font);
      background: var(--ui-bg);
      color: var(--ui-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 顶部栏 ===== */
    .topbar {
      background: var(--ui-surface);
      border-bottom: 1px solid var(--ui-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ui-text);
      letter-spacing: 0.02em;
    }

    .topbar-version {
      font-size: 11px;
      color: var(--ui-text-muted);
      background: var(--ui-bg);
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* ===== 桌面端主布局 ===== */
    .main {
      display: flex;
      flex: 1;
      gap: 0;
      height: calc(100vh - 49px);
    }

    /* ===== 左侧面板 ===== */
    .panel-left {
      width: 380px;
      min-width: 320px;
      background: var(--ui-surface);
      border-right: 1px solid var(--ui-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--ui-border);
    }

    .panel-section:last-child { border-bottom: none; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ui-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    /* ===== 输入框 ===== */
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      padding: 10px 12px;
      font-family: var(--ui-font);
      font-size: 13px;
      color: var(--ui-text);
      background: var(--ui-bg);
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--ui-accent);
    }

    #md-input {
      height: 180px;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    #note-input {
      height: 80px;
      font-family: var(--ui-font);
      font-size: 12px;
      line-height: 1.6;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .input-row:last-child { margin-bottom: 0; }

    .input-label {
      font-size: 12px;
      color: var(--ui-text-muted);
      width: 40px;
      flex-shrink: 0;
    }

    /* ===== 文本操作按钮组 ===== */
    .text-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn-small {
      flex: 1;
      min-width: 60px;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      background: var(--ui-bg);
      color: var(--ui-text-muted);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-small:hover {
      border-color: var(--ui-accent);
      color: var(--ui-text);
    }

    .btn-small.danger:hover {
      border-color: #e05a5a;
      color: #e05a5a;
    }

    /* ===== 色板 ===== */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .palette-item {
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.1s;
      aspect-ratio: 1;
    }

    .palette-item:hover { transform: scale(1.05); }
    .palette-item.active { border-color: var(--ui-text); }

    .palette-swatch {
      width: 100%;
      height: 70%;
      display: flex;
    }

    .palette-swatch-a { flex: 1; }
    .palette-swatch-b { flex: 1; }

    .palette-name {
      font-size: 9px;
      text-align: center;
      padding: 2px;
      background: var(--ui-surface);
      color: var(--ui-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-color-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .color-picker-wrap label {
      font-size: 11px;
      color: var(--ui-text-muted);
    }

    input[type="color"] {
      width: 32px;
      height: 28px;
      border: 1px solid var(--ui-border);
      border-radius: 4px;
      padding: 2px;
      cursor: pointer;
      background: var(--ui-bg);
    }

    /* ===== 主题切换 ===== */
    .toggle-row {
      display: flex;
      gap: 6px;
    }

    .toggle-btn {
      flex: 1;
      padding: 7px;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      background: var(--ui-bg);
      color: var(--ui-text-muted);
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .toggle-btn.active {
      background: var(--ui-text);
      color: var(--ui-bg);
      border-color: var(--ui-text);
    }

    /* ===== 开关 ===== */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .switch-row:last-child { margin-bottom: 0; }

    .switch-label {
      font-size: 12px;
      color: var(--ui-text);
    }

    .switch {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .switch-track {
      position: absolute;
      inset: 0;
      background: var(--ui-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .switch-track::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .switch-track { background: var(--ui-text); }
    .switch input:checked + .switch-track::after { transform: translateX(16px); }

    /* ===== 桌面端底部按钮区 ===== */
    .btn-area {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
    }

    .btn-generate {
      flex: 1;
      padding: 12px;
      background: var(--ui-text);
      color: var(--ui-bg);
      border: none;
      border-radius: var(--ui-radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.15s;
    }

    .btn-generate:hover { opacity: 0.85; }
    .btn-generate:active { opacity: 0.7; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-clear-all {
      padding: 12px 16px;
      background: transparent;
      color: var(--ui-text-muted);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-clear-all:hover {
      border-color: #e05a5a;
      color: #e05a5a;
    }

    /* ===== 右侧预览（桌面） ===== */
    .panel-right {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-label {
      font-size: 11px;
      color: var(--ui-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      align-self: flex-start;
    }

    /* ===== 手机端 tab 栏（桌面隐藏） ===== */
    .mobile-tabs {
      display: none;
    }

    /* ===== 手机端固定底部按钮（桌面隐藏） ===== */
    .mobile-bottom {
      display: none;
    }

    /* ===== 卡片 ===== */
    #card {
      width: 600px;
      min-height: 200px;
      padding: 52px 64px 48px;
      position: relative;
      font-family: 'Noto Serif SC', 'Source Han Serif CN', STSong, SimSun, serif;
      background: #FAF7F2;
      color: #2C2416;
      box-shadow: 0 4px 32px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    #card::before,
    #card::after {
      content: '';
      position: absolute;
      right: 0;
      height: 12px;
      border-radius: 2px 0 0 2px;
    }

    #card::before {
      top: 46px;
      width: 80px;
      background: var(--deco-a, #8A9BAD);
    }

    #card::after {
      top: 64px;
      width: 44px;
      background: var(--deco-b, #B8A898);
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      padding-right: 100px;
    }

    .card-author {
      font-size: 13px;
      opacity: 0.6;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }

    .card-divider {
      width: 66%;
      height: 1px;
      background: currentColor;
      opacity: 0.18;
      margin-bottom: 24px;
    }

    .card-note {
      font-size: 13px;
      line-height: 1.8;
      letter-spacing: 0.03em;
      opacity: 0.7;
      border-left: 2px solid currentColor;
      padding: 10px 14px;
      margin-bottom: 24px;
    }

    .card-body {
      font-size: 15px;
      line-height: 1.9;
      letter-spacing: 0.02em;
      font-feature-settings: "chws" 1, "halt" 1;
    }

    .card-body p { margin-bottom: 1.1em; }
    .card-body p:last-child { margin-bottom: 0; }

    .card-body h1, .card-body h2, .card-body h3 {
      font-weight: 700;
      margin: 1.4em 0 0.6em;
      line-height: 1.4;
    }

    .card-body h1 { font-size: 1.2em; }
    .card-body h2 { font-size: 1.1em; }
    .card-body h3 { font-size: 1em; }

    .card-body strong { font-weight: 700; }
    .card-body em { font-style: italic; }

    .card-body blockquote {
      border-left: 3px solid currentColor;
      opacity: 0.8;
      padding-left: 16px;
      margin: 1em 0;
    }

    .card-body ul, .card-body ol {
      padding-left: 1.5em;
      margin-bottom: 1em;
    }

    .card-body li { margin-bottom: 0.3em; }

    .card-body code {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 0.85em;
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .card-body pre {
      background: rgba(0,0,0,0.06);
      padding: 14px 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1em;
    }

    .card-body pre code { background: none; padding: 0; font-size: 12px; }

    .card-body hr {
      border: none;
      border-top: 1px solid currentColor;
      opacity: 0.15;
      margin: 1.5em 0;
    }

    .card-date {
      text-align: right;
      font-size: 12px;
      opacity: 0.4;
      margin-top: 28px;
      letter-spacing: 0.05em;
    }

    #card.dark { background: #1A1A1F; color: #E8E4DC; }
    #card.dark .card-body code { background: rgba(255,255,255,0.08); }
    #card.dark .card-body pre { background: rgba(255,255,255,0.06); }

    /* ===== toast ===== */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ui-text);
      color: var(--ui-bg);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show { opacity: 1; }

    /* ===== 手机端响应式 ===== */
    @media (max-width: 768px) {
      /* 顶部栏紧凑 */
      .topbar { padding: 10px 16px; }

      /* 主布局变单列，不固定高度 */
      .main {
        flex-direction: column;
        height: auto;
        min-height: calc(100vh - 45px);
        padding-bottom: 72px; /* 留出底部按钮空间 */
      }

      /* 左侧面板全宽，无边框 */
      .panel-left {
        width: 100%;
        min-width: unset;
        border-right: none;
        overflow-y: visible;
      }

      /* 桌面端按钮区隐藏 */
      .btn-area { display: none; }

      /* 预览区 */
      .panel-right {
        padding: 16px;
        overflow-y: visible;
      }

      /* 预览标签隐藏（tab栏替代） */
      .preview-label { display: none; }

      /* tab切换：编辑/预览 */
      .mobile-tabs {
        display: flex;
        background: var(--ui-surface);
        border-bottom: 1px solid var(--ui-border);
        position: sticky;
        top: 45px;
        z-index: 90;
      }

      .mobile-tab {
        flex: 1;
        padding: 11px;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--ui-text-muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.15s;
        background: none;
        border-top: none;
        border-left: none;
        border-right: none;
      }

      .mobile-tab.active {
        color: var(--ui-text);
        border-bottom-color: var(--ui-text);
      }

      /* tab内容切换 */
      .panel-left.tab-hidden { display: none; }
      .panel-right.tab-hidden { display: none; }

      /* 手机端输入框更高 */
      #md-input { height: 240px; }

      /* 卡片缩放适应手机宽度 */
      #card {
        width: 600px;
        transform-origin: top left;
        /* transform在JS里动态设置 */
      }

      .card-wrap {
        width: 100%;
        overflow: hidden;
      }

      /* 固定底部按钮 */
      .mobile-bottom {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        background: var(--ui-surface);
        border-top: 1px solid var(--ui-border);
        gap: 8px;
        z-index: 200;
      }

      .mobile-bottom .btn-generate {
        flex: 1;
        padding: 12px;
      }

      .mobile-bottom .btn-clear-all {
        padding: 12px 14px;
      }

      /* toast在固定按钮上方 */
      .toast { bottom: 80px; }

      /* section padding收窄 */
      .panel-section { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">文字转长图</span>
  <span class="topbar-version">v1.3.0</span>
</div>

<!-- 手机端 tab 栏 -->
<div class="mobile-tabs">
  <button class="mobile-tab active" id="tab-edit" onclick="switchTab('edit')">编辑</button>
  <button class="mobile-tab" id="tab-preview" onclick="switchTab('preview')">预览</button>
</div>

<div class="main">
  <!-- 左侧/编辑面板 -->
  <div class="panel-left" id="panel-edit">

    <div class="panel-section">
      <div class="section-label">正文（支持 Markdown）</div>
      <textarea id="md-input" placeholder="在这里粘贴文本内容，支持 **加粗**、*斜体*、# 标题、> 引用等 Markdown 语法&#10;单回车即可换行"></textarea>
      <div class="text-actions">
        <button class="btn-small" onclick="stripMarkdown()">去除 MD 语法</button>
        <button class="btn-small" onclick="halfWidthPunct()">标点半角化</button>
        <button class="btn-small" onclick="copyAll()">复制全文</button>
        <button class="btn-small danger" onclick="clearText()">清空正文</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">标题 / 作者</div>
      <div class="input-row">
        <span class="input-label">标题</span>
        <input type="text" id="input-title" placeholder="文章标题（可留空）">
      </div>
      <div class="input-row">
        <span class="input-label">作者</span>
        <input type="text" id="input-author" placeholder="作者 / 笔名（可留空）">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">角色配色</div>
      <div class="palette-grid" id="palette-grid"></div>
      <div class="custom-color-row">
        <div class="color-picker-wrap">
          <label>自定义A</label>
          <input type="color" id="custom-a" value="#8A9BAD">
        </div>
        <div class="color-picker-wrap">
          <label>自定义B</label>
          <input type="color" id="custom-b" value="#B8A898">
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">背景主题</div>
      <div class="toggle-row">
        <button class="toggle-btn active" id="theme-light" onclick="setTheme('light')">☀ 浅色</button>
        <button class="toggle-btn" id="theme-dark" onclick="setTheme('dark')">☾ 暗色</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">选项</div>
      <div class="switch-row">
        <span class="switch-label">显示日期</span>
        <label class="switch">
          <input type="checkbox" id="show-date" checked>
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="switch-row">
        <span class="switch-label">显示备注（Note）</span>
        <label class="switch">
          <input type="checkbox" id="show-note">
          <span class="switch-track"></span>
        </label>
      </div>
      <div id="note-area" style="display:none; margin-top:10px;">
        <textarea id="note-input" placeholder="在此输入备注内容，如阅读前提示、作者的话等（纯文本，不支持 Markdown）"></textarea>
      </div>
    </div>

    <!-- 桌面端按钮 -->
    <div class="btn-area">
      <button class="btn-generate" onclick="generateImage()">生成并下载图片</button>
      <button class="btn-clear-all" onclick="clearAll()">全部清空</button>
    </div>

  </div>

  <!-- 右侧/预览面板 -->
  <div class="panel-right" id="panel-preview">
    <div class="preview-label">预览</div>
    <div class="card-wrap">
      <div id="card">
        <div class="card-title" id="card-title" style="display:none"></div>
        <div class="card-author" id="card-author" style="display:none"></div>
        <div class="card-divider" id="card-divider" style="display:none"></div>
        <div class="card-note" id="card-note" style="display:none"></div>
        <div class="card-body" id="card-body"></div>
        <div class="card-date" id="card-date"></div>
      </div>
    </div>
  </div>
</div>

<!-- 手机端固定底部按钮 -->
<div class="mobile-bottom">
  <button class="btn-generate" onclick="generateImage()">生成并下载图片</button>
  <button class="btn-clear-all" onclick="clearAll()">全部清空</button>
</div>

<div class="toast" id="toast"></div>

<script>
marked.setOptions({ breaks: true });

const PALETTES = [
  { name: 'default',     a: '#8A9BAD', b: '#B8A898' },
  { name: 'satoyuki',    a: '#FFE033', b: '#BDE0FF' },
  { name: 'schatsilber', a: '#FF7F8F', b: '#C8CDD4' },
  { name: 'yuriko',      a: '#FF6347', b: '#FFF0F0' },
  { name: 'spettro',     a: '#C0192A', b: '#F0B429' },
  { name: 'giraffe',     a: '#E8C96A', b: '#A8D8A0' },
  { name: 'SSS',         a: '#F0F4F8', b: '#E8724A' },
  { name: 'minerva',     a: '#40E0D0', b: '#7A9EA8' },
  { name: 'amesoko',     a: '#C084FC', b: '#FFF3B0' },
  { name: 'starfocus',   a: '#1E1B4B', b: '#E2E8F0' },
];

let currentTheme = 'light';
let currentTab = 'edit';

// ===== 手机端 tab 切换 =====
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('panel-edit').classList.toggle('tab-hidden', tab !== 'edit');
  document.getElementById('panel-preview').classList.toggle('tab-hidden', tab !== 'preview');
  document.getElementById('tab-edit').classList.toggle('active', tab === 'edit');
  document.getElementById('tab-preview').classList.toggle('active', tab === 'preview');
  if (tab === 'preview') scaleCard();
}

// ===== 卡片缩放（手机端适应屏幕宽） =====
function scaleCard() {
  const card = document.getElementById('card');
  const wrap = card.parentElement;
  if (window.innerWidth <= 768) {
    const scale = wrap.offsetWidth / 600;
    card.style.transform = `scale(${scale})`;
    card.style.transformOrigin = 'top left';
    wrap.style.height = (card.offsetHeight * scale) + 'px';
  } else {
    card.style.transform = '';
    card.style.transformOrigin = '';
    wrap.style.height = '';
  }
}

// ===== 色板 =====
function initPalette() {
  const grid = document.getElementById('palette-grid');
  PALETTES.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'palette-item' + (i === 0 ? ' active' : '');
    item.title = p.name;
    item.innerHTML = `
      <div class="palette-swatch">
        <div class="palette-swatch-a" style="background:${p.a}"></div>
        <div class="palette-swatch-b" style="background:${p.b}"></div>
      </div>
      <div class="palette-name">${p.name}</div>
    `;
    item.onclick = () => selectPalette(p, item);
    grid.appendChild(item);
  });
}

function selectPalette(p, el) {
  document.querySelectorAll('.palette-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('custom-a').value = p.a;
  document.getElementById('custom-b').value = p.b;
  applyDeco();
}

function applyDeco() {
  const a = document.getElementById('custom-a').value;
  const b = document.getElementById('custom-b').value;
  document.getElementById('card').style.setProperty('--deco-a', a);
  document.getElementById('card').style.setProperty('--deco-b', b);
}

// ===== 主题 =====
function setTheme(t) {
  currentTheme = t;
  document.getElementById('card').classList.toggle('dark', t === 'dark');
  document.getElementById('theme-light').classList.toggle('active', t === 'light');
  document.getElementById('theme-dark').classList.toggle('active', t === 'dark');
}

// ===== 预览更新 =====
function updatePreview() {
  const title = document.getElementById('input-title').value.trim();
  const author = document.getElementById('input-author').value.trim();
  const md = document.getElementById('md-input').value;
  const showDate = document.getElementById('show-date').checked;
  const showNote = document.getElementById('show-note').checked;
  const noteText = document.getElementById('note-input').value.trim();

  const titleEl = document.getElementById('card-title');
  const authorEl = document.getElementById('card-author');
  const dividerEl = document.getElementById('card-divider');
  const noteEl = document.getElementById('card-note');

  titleEl.style.display = title ? '' : 'none';
  if (title) titleEl.textContent = title;

  authorEl.style.display = author ? '' : 'none';
  if (author) authorEl.textContent = '\u2014 ' + author;

  dividerEl.style.display = (title || author) ? '' : 'none';

  if (showNote && noteText) {
    noteEl.innerHTML = noteText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    noteEl.style.display = '';
  } else {
    noteEl.style.display = 'none';
  }

  document.getElementById('card-body').innerHTML = marked.parse(md);

  const dateEl = document.getElementById('card-date');
  if (showDate) {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    dateEl.textContent = `${y}.${m}.${d}`;
    dateEl.style.display = '';
  } else {
    dateEl.style.display = 'none';
  }

  // 预览更新后重新计算缩放
  setTimeout(scaleCard, 50);
}

// ===== 标点处理 =====
function stripMarkdown() {
  const el = document.getElementById('md-input');
  let text = el.value;
  text = text.replace(/^#{1,6}\s+/gm, '');
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '$1');
  text = text.replace(/\*\*(.+?)\*\*/g, '$1');
  text = text.replace(/\*(.+?)\*/g, '$1');
  text = text.replace(/___(.+?)___/g, '$1');
  text = text.replace(/__(.+?)__/g, '$1');
  text = text.replace(/_(.+?)_/g, '$1');
  text = text.replace(/~~(.+?)~~/g, '$1');
  text = text.replace(/`(.+?)`/g, '$1');
  text = text.replace(/```[\s\S]*?```/g, '');
  text = text.replace(/^>\s+/gm, '');
  text = text.replace(/^[-*+]\s+/gm, '');
  text = text.replace(/^\d+\.\s+/gm, '');
  text = text.replace(/\[(.+?)\]\(.+?\)/g, '$1');
  text = text.replace(/!\[.*?\]\(.+?\)/g, '');
  text = text.replace(/^[-*_]{3,}\s*$/gm, '');
  text = text.replace(/\n{3,}/g, '\n\n');
  el.value = text.trim();
  updatePreview();
  showToast('已去除 Markdown 语法');
}

function halfWidthPunct() {
  const el = document.getElementById('md-input');
  let text = el.value;
  text = text
    .replace(/（/g, '(')
    .replace(/）/g, ')')
    .replace(/【/g, '[')
    .replace(/】/g, ']')
    .replace(/\u201C/g, '"')
    .replace(/\u201D/g, '"');
  el.value = text;
  updatePreview();
  showToast('全角括号、引号已转为半角');
}

function copyAll() {
  const text = document.getElementById('md-input').value;
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板');
  }).catch(() => {
    showToast('复制失败，请手动选择');
  });
}

function clearText() {
  document.getElementById('md-input').value = '';
  updatePreview();
}

function clearAll() {
  document.getElementById('md-input').value = '';
  document.getElementById('input-title').value = '';
  document.getElementById('input-author').value = '';
  document.getElementById('note-input').value = '';
  updatePreview();
  showToast('已全部清空');
}

// ===== 生成图片 =====
async function generateImage() {
  const btns = document.querySelectorAll('.btn-generate');
  btns.forEach(b => { b.textContent = '生成中…'; b.disabled = true; });

  // 导出前临时还原缩放
  const card = document.getElementById('card');
  const savedTransform = card.style.transform;
  const savedOrigin = card.style.transformOrigin;
  card.style.transform = '';
  card.style.transformOrigin = '';

  try {
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: null,
      logging: false,
    });

    const link = document.createElement('a');
    const title = document.getElementById('input-title').value.trim() || '长图';
    const now = new Date();
    const y = now.getFullYear();
    const mo = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const mi = String(now.getMinutes()).padStart(2, '0');
    link.download = `${title}_${y}${mo}${d}_${h}${mi}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert('生成失败：' + e.message);
  }

  // 恢复缩放
  card.style.transform = savedTransform;
  card.style.transformOrigin = savedOrigin;

  btns.forEach(b => { b.textContent = '生成并下载图片'; b.disabled = false; });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ===== 事件监听 =====
document.getElementById('md-input').addEventListener('input', updatePreview);
document.getElementById('input-title').addEventListener('input', updatePreview);
document.getElementById('input-author').addEventListener('input', updatePreview);
document.getElementById('note-input').addEventListener('input', updatePreview);
document.getElementById('show-date').addEventListener('change', updatePreview);
document.getElementById('show-note').addEventListener('change', function() {
  document.getElementById('note-area').style.display = this.checked ? '' : 'none';
  updatePreview();
});
document.getElementById('custom-a').addEventListener('input', () => {
  document.querySelectorAll('.palette-item').forEach(i => i.classList.remove('active'));
  applyDeco();
});
document.getElementById('custom-b').addEventListener('input', () => {
  document.querySelectorAll('.palette-item').forEach(i => i.classList.remove('active'));
  applyDeco();
});
window.addEventListener('resize', scaleCard);

// ===== 初始化 =====
initPalette();
applyDeco();
updatePreview();
</script>
