<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 文字转长图工具 v1.5.0 -->
  <!-- 三种输出：一张长图 · 自由分页（=== 断页 + 高度上限）· 小红书 3:4 分页 -->
  <!-- v1.5.0：统一分页引擎、可增删的本地色板、署名水印、首行缩进、字数与阅读时长、拖拽导入 -->
  <title>文字转长图 v1.5.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ui-bg: #F5F3EF;
      --ui-surface: #FFFFFF;
      --ui-border: #DDD9D0;
      --ui-text: #2C2416;
      --ui-text-muted: #7A7060;
      --ui-accent: #8A9BAD;
      --ui-radius: 8px;
      --ui-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --deco-a: #8A9BAD;
      --deco-b: #B8A898;
      --pg-fs: 15px;
      --pg-lh: 1.8;
    }

    body {
      font-family: var(--ui-font);
      background: var(--ui-bg);
      color: var(--ui-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 顶部栏 ===== */
    .topbar {
      background: var(--ui-surface);
      border-bottom: 1px solid var(--ui-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }

    .topbar-version {
      font-size: 11px;
      color: var(--ui-text-muted);
      background: var(--ui-bg);
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* ===== 主布局 ===== */
    .main {
      display: flex;
      flex: 1;
      height: calc(100vh - 49px);
    }

    .panel-left {
      width: 380px;
      min-width: 320px;
      background: var(--ui-surface);
      border-right: 1px solid var(--ui-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-section { padding: 16px 20px; border-bottom: 1px solid var(--ui-border); }
    .panel-section:last-child { border-bottom: none; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ui-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-label .link-btn {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      font-size: 11px;
      color: var(--ui-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 2px;
      border-bottom: 1px solid var(--ui-border);
    }

    .section-label .link-btn:hover { color: var(--ui-text); border-bottom-color: var(--ui-accent); }
    .section-label .link-btn.on { color: var(--ui-text); border-bottom-color: var(--ui-text); }

    /* ===== 输入 ===== */
    textarea, input[type="text"], select {
      width: 100%;
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      padding: 10px 12px;
      font-family: var(--ui-font);
      font-size: 13px;
      color: var(--ui-text);
      background: var(--ui-bg);
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }

    select {
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--ui-text-muted) 50%),
                        linear-gradient(135deg, var(--ui-text-muted) 50%, transparent 50%);
      background-position: calc(100% - 14px) 12px, calc(100% - 9px) 12px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    textarea:focus, input[type="text"]:focus, select:focus { border-color: var(--ui-accent); }

    #md-input {
      height: 180px;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    #md-input.dragover { border-color: var(--ui-accent); background: #EEF2F6; }

    #note-input { height: 80px; font-size: 12px; line-height: 1.6; }

    .input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .input-row:last-child { margin-bottom: 0; }

    .input-label { font-size: 12px; color: var(--ui-text-muted); width: 52px; flex-shrink: 0; }

    /* ===== 小按钮组 ===== */
    .text-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    .btn-small {
      flex: 1 1 auto;
      min-width: 64px;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      background: var(--ui-bg);
      color: var(--ui-text-muted);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-small:hover { border-color: var(--ui-accent); color: var(--ui-text); }
    .btn-small.danger:hover { border-color: #e05a5a; color: #e05a5a; }

    /* ===== 色板 ===== */
    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

    .palette-item {
      position: relative;
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.1s;
      aspect-ratio: 1;
    }

    .palette-item:hover { transform: scale(1.05); }
    .palette-item.active { border-color: var(--ui-text); }

    .palette-swatch { width: 100%; height: 70%; display: flex; }
    .palette-swatch-a, .palette-swatch-b { flex: 1; }

    .palette-name {
      font-size: 9px;
      text-align: center;
      padding: 2px;
      background: var(--ui-surface);
      color: var(--ui-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .palette-del {
      position: absolute;
      top: 1px;
      right: 1px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 11px;
      line-height: 15px;
      text-align: center;
      cursor: pointer;
      padding: 0;
      display: none;
    }

    body.palette-edit .palette-del { display: block; }

    .custom-color-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .color-picker-wrap { display: flex; align-items: center; gap: 6px; flex: 1; }
    .color-picker-wrap label { font-size: 11px; color: var(--ui-text-muted); }

    input[type="color"] {
      width: 32px;
      height: 28px;
      border: 1px solid var(--ui-border);
      border-radius: 4px;
      padding: 2px;
      cursor: pointer;
      background: var(--ui-bg);
    }

    /* ===== 切换按钮 ===== */
    .toggle-row { display: flex; gap: 6px; }

    .toggle-btn {
      flex: 1;
      padding: 7px 4px;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      background: var(--ui-bg);
      color: var(--ui-text-muted);
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .toggle-btn.active { background: var(--ui-text); color: var(--ui-bg); border-color: var(--ui-text); }

    /* ===== 开关 ===== */
    .switch-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .switch-row:last-child { margin-bottom: 0; }
    .switch-label { font-size: 12px; }
    .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }

    .switch-track {
      position: absolute;
      inset: 0;
      background: var(--ui-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .switch-track::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .switch-track { background: var(--ui-text); }
    .switch input:checked + .switch-track::after { transform: translateX(16px); }

    /* ===== 提示 ===== */
    .hint { font-size: 11px; color: var(--ui-text-muted); line-height: 1.6; margin-top: 8px; }
    .hint.warn { color: #c2703c; }

    .hint code {
      font-family: 'SF Mono', 'Consolas', monospace;
      background: var(--ui-bg);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* ===== 底部按钮 ===== */
    .btn-area { display: flex; gap: 8px; padding: 16px 20px; flex-wrap: wrap; }

    .btn-generate {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      background: var(--ui-text);
      color: var(--ui-bg);
      border: none;
      border-radius: var(--ui-radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.15s;
    }

    .btn-generate:hover { opacity: 0.85; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      padding: 12px 14px;
      background: transparent;
      color: var(--ui-text);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-secondary:hover { border-color: var(--ui-accent); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-clear-all {
      padding: 12px 16px;
      background: transparent;
      color: var(--ui-text-muted);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-clear-all:hover { border-color: #e05a5a; color: #e05a5a; }

    /* ===== 预览面板 ===== */
    .panel-right {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-label {
      font-size: 11px;
      color: var(--ui-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      align-self: flex-start;
    }

    /* ===== 模式可见性 ===== */
    body.mode-long .only-paged, body.mode-free .only-paged { display: none !important; }
    body.mode-paged .only-flow { display: none !important; }
    body.mode-long .only-free, body.mode-paged .only-free { display: none !important; }
    body.single-shot .act-multi { display: none !important; }
    body:not(.single-shot) .act-single { display: none !important; }

    .mobile-tabs { display: none; }
    .mobile-bottom { display: none; }

    /* ===== 通用卡片文字样式 ===== */
    .card, .page {
      font-family: 'Noto Serif SC', 'Source Han Serif CN', STSong, SimSun, serif;
      background: #FAF7F2;
      color: #2C2416;
      position: relative;
      overflow: hidden;
    }

    .card.dark, .page.dark { background: #1A1A1F; color: #E8E4DC; }

    /* ===== 长图 / 自由分页卡片 ===== */
    .card {
      width: 600px;
      min-height: 200px;
      padding: 52px 64px 48px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.12);
    }

    .card.has-head::before,
    .card.has-head::after {
      content: '';
      position: absolute;
      right: 0;
      height: 12px;
      border-radius: 2px 0 0 2px;
    }

    .card.has-head::before { top: 46px; width: 80px; background: var(--deco-a); }
    .card.has-head::after  { top: 64px; width: 44px; background: var(--deco-b); }

    .card.no-head::before,
    .card.no-head::after {
      content: '';
      position: absolute;
      right: 0;
      height: 6px;
      border-radius: 2px 0 0 2px;
    }

    .card.no-head::before { top: 34px; width: 44px; background: var(--deco-a); }
    .card.no-head::after  { top: 44px; width: 22px; background: var(--deco-b); }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      padding-right: 100px;
    }

    .card-author { font-size: 13px; opacity: 0.6; letter-spacing: 0.04em; }

    .meta-line {
      font-size: 12px;
      opacity: 0.42;
      letter-spacing: 0.05em;
      margin-top: 5px;
    }

    .card-head-gap { height: 24px; }

    .card-divider {
      width: 66%;
      height: 1px;
      background: currentColor;
      opacity: 0.18;
      margin-bottom: 24px;
    }

    .card-note {
      font-size: 13px;
      line-height: 1.8;
      letter-spacing: 0.03em;
      opacity: 0.7;
      border-left: 2px solid var(--deco-b);
      padding: 10px 14px;
      margin-bottom: 24px;
    }

    .card-body {
      font-size: 15px;
      line-height: 1.9;
      letter-spacing: 0.02em;
      font-feature-settings: "chws" 1, "halt" 1;
    }

    .card-date {
      text-align: right;
      font-size: 12px;
      opacity: 0.4;
      margin-top: 28px;
      letter-spacing: 0.05em;
    }

    .card-seq {
      position: absolute;
      right: 64px;
      bottom: 20px;
      font-size: 11px;
      opacity: 0.3;
      letter-spacing: 0.1em;
    }

    /* ===== 3:4 分页 ===== */
    .page {
      width: 600px;
      height: 800px;
      padding: 48px 52px;
      display: flex;
      flex-direction: column;
    }

    .page.is-cover::before,
    .page.is-cover::after {
      content: '';
      position: absolute;
      right: 0;
      height: 12px;
      border-radius: 2px 0 0 2px;
    }

    .page.is-cover::before { top: 46px; width: 80px; background: var(--deco-a); }
    .page.is-cover::after  { top: 64px; width: 44px; background: var(--deco-b); }

    .page.is-inner::before,
    .page.is-inner::after {
      content: '';
      position: absolute;
      right: 0;
      height: 6px;
      border-radius: 2px 0 0 2px;
    }

    .page.is-inner::before { top: 30px; width: 44px; background: var(--deco-a); }
    .page.is-inner::after  { top: 40px; width: 22px; background: var(--deco-b); }

    .page.is-cover { justify-content: center; }

    .cover-mid { padding-right: 12px; }

    .cover-eyebrow { font-size: 12px; letter-spacing: 0.32em; opacity: 0.45; margin-bottom: 18px; }

    .cover-title {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.03em;
      margin-bottom: 18px;
    }

    .cover-rule { width: 56px; height: 2px; background: var(--deco-a); margin-bottom: 18px; }

    .cover-author { font-size: 15px; opacity: 0.62; letter-spacing: 0.08em; }

    .cover-mid .meta-line { font-size: 12.5px; margin-top: 8px; }

    .cover-note {
      margin-top: 34px;
      font-size: 13.5px;
      line-height: 1.9;
      letter-spacing: 0.03em;
      opacity: 0.72;
      border-left: 2px solid var(--deco-b);
      padding: 8px 0 8px 14px;
      max-height: 300px;
      overflow: hidden;
    }

    .cover-date {
      position: absolute;
      left: 52px;
      bottom: 44px;
      font-size: 12px;
      opacity: 0.38;
      letter-spacing: 0.08em;
    }

    .note-head { font-size: 13px; letter-spacing: 0.4em; opacity: 0.45; margin-bottom: 22px; }

    .note-text {
      font-size: 15px;
      line-height: 1.95;
      letter-spacing: 0.03em;
      opacity: 0.85;
      flex: 1;
      overflow: hidden;
    }

    .page-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      font-size: var(--pg-fs);
      line-height: var(--pg-lh);
      letter-spacing: 0.02em;
      font-feature-settings: "chws" 1, "halt" 1;
    }

    .page-foot {
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 12px;
      opacity: 0.4;
      letter-spacing: 0.12em;
    }

    .page-foot.pos-right { justify-content: flex-end; }
    .page-foot.pos-split { justify-content: space-between; }

    .foot-title {
      opacity: 0.75;
      letter-spacing: 0.06em;
      max-width: 330px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== 署名水印 ===== */
    .stamp {
      position: absolute;
      bottom: 18px;
      font-size: 10px;
      letter-spacing: 0.12em;
      opacity: 0.28;
    }

    .card .stamp { left: 64px; }
    .page .stamp { right: 52px; }

    /* ===== 正文排版（三种模式共用） ===== */
    .card-body p, .page-body p, .m-box p { margin-bottom: 1.1em; }

    .card-body > *:first-child, .page-body > *:first-child, .m-box > *:first-child { margin-top: 0; }
    .card-body > *:last-child, .page-body > *:last-child, .m-box > *:last-child { margin-bottom: 0; }

    .card-body h1, .card-body h2, .card-body h3,
    .page-body h1, .page-body h2, .page-body h3,
    .m-box h1, .m-box h2, .m-box h3 {
      font-weight: 700;
      margin: 1.4em 0 0.6em;
      line-height: 1.4;
    }

    .card-body h1, .page-body h1, .m-box h1 { font-size: 1.2em; }
    .card-body h2, .page-body h2, .m-box h2 { font-size: 1.1em; }
    .card-body h3, .page-body h3, .m-box h3 { font-size: 1em; }

    .card-body strong, .page-body strong, .m-box strong { font-weight: 700; }
    .card-body em, .page-body em, .m-box em { font-style: italic; }

    .card-body blockquote, .page-body blockquote, .m-box blockquote {
      border-left: 3px solid currentColor;
      opacity: 0.8;
      padding-left: 16px;
      margin: 1em 0;
    }

    .card-body ul, .card-body ol,
    .page-body ul, .page-body ol,
    .m-box ul, .m-box ol { padding-left: 1.5em; margin-bottom: 1em; }

    .card-body li, .page-body li, .m-box li { margin-bottom: 0.3em; }

    .card-body code, .page-body code, .m-box code {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 0.85em;
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .card-body pre, .page-body pre, .m-box pre {
      background: rgba(0,0,0,0.06);
      padding: 14px 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1em;
    }

    .card-body pre code, .page-body pre code { background: none; padding: 0; font-size: 12px; }

    .card-body hr, .page-body hr, .m-box hr {
      border: none;
      border-top: 1px solid currentColor;
      opacity: 0.15;
      margin: 1.5em 0;
    }

    .card.dark .card-body code, .page.dark .page-body code { background: rgba(255,255,255,0.08); }
    .card.dark .card-body pre, .page.dark .page-body pre { background: rgba(255,255,255,0.06); }

    /* 首行缩进 */
    body.indent .card-body p,
    body.indent .page-body p,
    body.indent .m-box p { text-indent: 2em; }

    /* ===== 预览容器 ===== */
    .flow-list {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 600px;
      max-width: 100%;
    }

    .flow-cell, .page-cell { display: flex; flex-direction: column; gap: 8px; }

    .card-thumb, .page-thumb { position: relative; overflow: hidden; }

    .page-thumb {
      border-radius: 4px;
      box-shadow: 0 3px 18px rgba(0,0,0,0.12);
      background: var(--ui-surface);
    }

    .card-thumb .card, .page-thumb .page { transform-origin: top left; }

    .pages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 22px 18px;
      width: 100%;
    }

    .shot-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--ui-text-muted);
    }

    .shot-meta button {
      border: 1px solid var(--ui-border);
      background: var(--ui-surface);
      color: var(--ui-text-muted);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .shot-meta button:hover { border-color: var(--ui-accent); color: var(--ui-text); }

    .empty-state {
      width: 100%;
      padding: 60px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--ui-text-muted);
      border: 1px dashed var(--ui-border);
      border-radius: var(--ui-radius);
    }

    /* ===== 离屏测量 / 导出 ===== */
    #measure-wrap {
      position: absolute;
      left: -99999px;
      top: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #export-holder {
      position: fixed;
      left: -10000px;
      top: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* ===== toast ===== */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ui-text);
      color: var(--ui-bg);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
      max-width: 80vw;
      text-align: center;
    }

    .toast.show { opacity: 1; }

    /* ===== 手机端 ===== */
    @media (max-width: 768px) {
      .topbar { padding: 10px 16px; }

      .main {
        flex-direction: column;
        height: auto;
        min-height: calc(100vh - 45px);
        padding-bottom: 72px;
      }

      .panel-left { width: 100%; min-width: unset; border-right: none; overflow-y: visible; }

      .btn-area { display: none; }

      .panel-right { padding: 16px; overflow-y: visible; }

      .preview-label { display: none; }

      .mobile-tabs {
        display: flex;
        background: var(--ui-surface);
        border-bottom: 1px solid var(--ui-border);
        position: sticky;
        top: 45px;
        z-index: 90;
      }

      .mobile-tab {
        flex: 1;
        padding: 11px;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--ui-text-muted);
        cursor: pointer;
        border: none;
        border-bottom: 2px solid transparent;
        background: none;
        transition: all 0.15s;
      }

      .mobile-tab.active { color: var(--ui-text); border-bottom-color: var(--ui-text); }

      .panel-left.tab-hidden, .panel-right.tab-hidden { display: none; }

      #md-input { height: 240px; }

      .flow-list { width: 100%; }

      .pages-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 12px; }

      .mobile-bottom {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 12px 16px;
        background: var(--ui-surface);

      .mobile-bottom .btn-secondary { padding: 12px 12px; }
      .mobile-bottom .btn-clear-all { padding: 12px 14px; }

      .panel-section { padding: 14px 16px; }
    }
  </style>
</head>

<script>
marked.setOptions({ breaks: true });

/* 想固化色板就把「导出代码」的结果粘到这里 */
const DEFAULT_PALETTES = [
  { name: 'default',     a: '#8A9BAD', b: '#B8A898' },
  { name: 'satoyuki',    a: '#FFE033', b: '#BDE0FF' },
  { name: 'schatsilber', a: '#FF7F8F', b: '#C8CDD4' },
  { name: 'yuriko',      a: '#FF6347', b: '#FFF0F0' },
  { name: 'spettro',     a: '#C0192A', b: '#F0B429' },
  { name: 'giraffe',     a: '#E8C96A', b: '#A8D8A0' },
  { name: 'SSS',         a: '#F0F4F8', b: '#E8724A' },
  { name: 'minerva',     a: '#40E0D0', b: '#7A9EA8' },
  { name: 'amesoko',     a: '#C084FC', b: '#FFF3B0' },
  { name: 'starfocus',   a: '#1E1B4B', b: '#E2E8F0' },
];

const PAL_KEY = 'inkcard.palettes.v1';
let PALETTES = [];

const CARD_W = 600;
const PAGE_W = 600, PAGE_H = 800;
const BREAK_RE = /^[ \t]*={3,}[ \t]*$/m;
const BREAK_RE_G = /^[ \t]*={3,}[ \t]*$/gm;

const DENSITY = {
  loose:  { fs: '15.5px', lh: '1.95' },
  normal: { fs: '15px',   lh: '1.8'  },
  tight:  { fs: '14px',   lh: '1.68' },
};

const NUM_STYLES = {
  none: () => '',
  pad:  (i) => String(i).padStart(2, '0'),
  frac: (i, n) => `${i} / ${n}`,
  dash: (i) => `— ${i} —`,
  dot:  (i) => `· ${String(i).padStart(2, '0')} ·`,
  cn:   (i) => `第 ${i} 页`,
};

let currentTheme = 'light';
let currentMode = 'long';
let SHOTS = [];
let rebuildTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nl2br = s => esc(s).replace(/\n/g, '<br>');

/* ===================== 色板 ===================== */
function loadPalettes() {
  try {
    const raw = localStorage.getItem(PAL_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) return arr;
    }
  } catch (e) {}
  return DEFAULT_PALETTES.slice();
}

function persistPalettes() {
  try { localStorage.setItem(PAL_KEY, JSON.stringify(PALETTES)); }
  catch (e) { showToast('本机存储不可用，色板本次有效'); }
}

function renderPalette() {
  const grid = $('palette-grid');
  grid.innerHTML = '';
  PALETTES.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'palette-item';
    item.title = p.name;
    item.innerHTML = `
      <div class="palette-swatch">
        <div class="palette-swatch-a" style="background:${p.a}"></div>
        <div class="palette-swatch-b" style="background:${p.b}"></div>
      </div>
      <div class="palette-name">${esc(p.name)}</div>
      <button class="palette-del" title="删除">×</button>
    `;
    item.onclick = () => selectPalette(p, item);
    item.querySelector('.palette-del').onclick = (e) => { e.stopPropagation(); deletePalette(i); };
    grid.appendChild(item);
  });
  markActivePalette();
}

function markActivePalette() {
  const a = $('custom-a').value.toUpperCase();
  const b = $('custom-b').value.toUpperCase();
  document.querySelectorAll('.palette-item').forEach((el, i) => {
    const p = PALETTES[i];
    el.classList.toggle('active', p && p.a.toUpperCase() === a && p.b.toUpperCase() === b);
  });
}

function selectPalette(p, el) {
  $('custom-a').value = p.a;
  $('custom-b').value = p.b;
  applyDeco();
  markActivePalette();
}

function togglePaletteEdit() {
  const on = document.body.classList.toggle('palette-edit');
  $('btn-pal-edit').classList.toggle('on', on);
  $('btn-pal-edit').textContent = on ? '完成' : '编辑';
}

function savePalette() {
  const name = (prompt('给这个配色起个名字（如角色名）') || '').trim();
  if (!name) return;
  const a = $('custom-a').value, b = $('custom-b').value;
  const idx = PALETTES.findIndex(p => p.name === name);
  if (idx >= 0) PALETTES[idx] = { name, a, b };
  else PALETTES.push({ name, a, b });
  persistPalettes();
  renderPalette();
  showToast(idx >= 0 ? `已更新「${name}」` : `已存为「${name}」`);
}

function deletePalette(i) {
  const p = PALETTES[i];
  if (!confirm(`删除色板「${p.name}」？`)) return;
  PALETTES.splice(i, 1);
  if (!PALETTES.length) PALETTES = DEFAULT_PALETTES.slice();
  persistPalettes();
  renderPalette();
}

function exportPalettes() {
  const lines = PALETTES.map(p =>
    `  { name: '${p.name.replace(/'/g, "\\'")}', a: '${p.a.toUpperCase()}', b: '${p.b.toUpperCase()}' },`);
  const code = 'const DEFAULT_PALETTES = [\n' + lines.join('\n') + '\n];';
  navigator.clipboard.writeText(code)
    .then(() => showToast('配色代码已复制，可粘回源码'))
    .catch(() => { prompt('复制下面这段，粘回源码的 DEFAULT_PALETTES：', code); });
}

function importPalettes() {
  const raw = prompt('粘贴配色 JSON 或 DEFAULT_PALETTES 代码：');
  if (!raw) return;
  const m = raw.match(/\[[\s\S]*\]/);
  if (!m) return showToast('没认出配色数据');
  try {
    const json = m[0]
      .replace(/([{,]\s*)(\w+)\s*:/g, '$1"$2":')
      .replace(/'/g, '"')
      .replace(/,(\s*[\]}])/g, '$1');
    const arr = JSON.parse(json);
    const ok = arr.filter(p => p && p.name && p.a && p.b);
    if (!ok.length) throw new Error('empty');
    PALETTES = ok;
    persistPalettes();
    renderPalette();
    showToast(`已导入 ${ok.length} 个色板`);
  } catch (e) {
    showToast('解析失败，检查一下格式');
  }
}

function applyDeco() {
  const root = document.documentElement;
  root.style.setProperty('--deco-a', $('custom-a').value);
  root.style.setProperty('--deco-b', $('custom-b').value);
}

/* ===================== 模式 / 主题 ===================== */
function setMode(m) {
  currentMode = m;
  document.body.className = document.body.className
    .replace(/\bmode-\w+\b/, '') + ' mode-' + m;
  ['long','free','paged'].forEach(k => $('mode-' + k).classList.toggle('active', k === m));
  rebuild();
}

function setTheme(t) {
  currentTheme = t;
  $('theme-light').classList.toggle('active', t === 'light');
  $('theme-dark').classList.toggle('active', t === 'dark');
  document.querySelectorAll('.shot, #m-card, #m-page').forEach(el => el.classList.toggle('dark', t === 'dark'));
}

function applyDensity() {
  const d = DENSITY[$('opt-density').value] || DENSITY.normal;
  document.documentElement.style.setProperty('--pg-fs', d.fs);
  document.documentElement.style.setProperty('--pg-lh', d.lh);
}

/* ===================== 文本 → 块 ===================== */
function getBlocks(md) {
  if (!md || !md.trim()) return [];
  const tokens = marked.lexer(md);
  const out = [];
  for (const t of tokens) {
    if (t.type === 'space') continue;
    const arr = [t];
    arr.links = tokens.links || {};
    const html = marked.parser(arr).trim();
    if (html) out.push(html);
  }
  return out;
}

function splitByMarker(md) {
  return md.split(BREAK_RE).map(s => s.trim()).filter(Boolean);
}

function stripMarkers(md) {
  return md.replace(BREAK_RE_G, '');
}

function countText(md) {
  const div = document.createElement('div');
  div.innerHTML = marked.parse(stripMarkers(md));
  const text = div.textContent || '';
  const cjk = (text.match(/[\u3400-\u9fff\u3040-\u30ff\uff00-\uffef]/g) || []).length;
  const lat = (text.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
  return cjk + lat;
}

function statLine(md) {
  const mode = $('opt-stat').value;
  if (mode === 'none') return '';
  const n = countText(md);
  if (!n) return '';
  const words = n.toLocaleString('en-US') + ' 字';
  if (mode === 'words') return words;
  return `${words} · 约 ${Math.max(1, Math.round(n / 400))} 分钟`;
}

/* ===================== 公共片段 ===================== */
function stampHTML() {
  const on = $('show-mark').checked;
  const t = $('input-mark').value.trim();
  return (on && t) ? `<div class="stamp">${esc(t)}</div>` : '';
}

function dateStr(sep) {
  const n = new Date();
  return [n.getFullYear(), String(n.getMonth()+1).padStart(2,'0'), String(n.getDate()).padStart(2,'0')].join(sep);
}

function flowHeadHTML() {
  const title = $('input-title').value.trim();
  const author = $('input-author').value.trim();
  const stat = statLine($('md-input').value);
  const showNote = $('show-note').checked;
  const note = $('note-input').value.trim();
  let h = '';
  if (title) h += `<div class="card-title">${esc(title)}</div>`;
  if (author) h += `<div class="card-author">— ${esc(author)}</div>`;
  if (stat) h += `<div class="meta-line">${esc(stat)}</div>`;
  if (title || author || stat) h += '<div class="card-head-gap"></div><div class="card-divider"></div>';
  if (showNote && note) h += `<div class="card-note">${nl2br(note)}</div>`;
  return h;
}

/* ===================== 长图 / 自由分页 ===================== */
function buildFlowShots() {
  const md = $('md-input').value;
  const free = currentMode === 'free';
  const maxH = free ? Number($('opt-maxh').value) : Infinity;
  const segs = free ? splitByMarker(md) : [stripMarkers(md)];

  const mc = $('m-card');
  const head = flowHeadHTML();
  const tail = ($('show-date').checked ? `<div class="card-date">${dateStr('.')}</div>` : '');

  const setM = (withHead, body) => {
    mc.className = 'card ' + (withHead ? 'has-head' : 'no-head');
    mc.innerHTML = (withHead ? head : '') + `<div class="card-body m-box">${body}</div>` + tail;
  };

  const bodies = [];
  for (const seg of segs) {
    const blocks = getBlocks(seg);
    if (!blocks.length) continue;
    if (!isFinite(maxH) || maxH >= 99999) { bodies.push(blocks.join('')); continue; }
    let cur = [];
    for (const b of blocks) {
      setM(bodies.length === 0, cur.join('') + b);
      if (mc.offsetHeight > maxH && cur.length) {
        bodies.push(cur.join(''));
        cur = [];
      }
      cur.push(b);
    }
    if (cur.length) bodies.push(cur.join(''));
  }

  if (!bodies.length) {
    if (!head) return [];
    bodies.push('');
  }

  const total = bodies.length;
  return bodies.map((body, i) => {
    const first = i === 0, last = i === total - 1;
    let h = first ? head : '';
    h += `<div class="card-body">${body}</div>`;
    if (last && $('show-date').checked) h += tail;
    if (total > 1) h += `<div class="card-seq">${i + 1} / ${total}</div>`;
    h += stampHTML();
    return {
      type: 'card',
      cls: 'card ' + (first ? 'has-head' : 'no-head'),
      label: total > 1 ? `第 ${i + 1} 段 / 共 ${total} 段` : '整篇',
      suffix: total > 1 ? String(i + 1).padStart(2, '0') : '',
      html: h,
    };
  });
}

/* ===================== 3:4 分页 ===================== */
function paginateSegment(seg) {
  const box = $('m-page-body');
  const blocks = getBlocks(seg);
  const pages = [];
  let cur = [];
  const fits = () => box.scrollHeight <= box.clientHeight + 1;

  for (const b of blocks) {
    box.innerHTML = cur.join('') + b;
    if (!fits()) {
      if (cur.length) { pages.push(cur.join('')); cur = []; box.innerHTML = b; }
      if (!fits()) {
        const parts = splitBlock(b, box);
        for (let k = 0; k < parts.length - 1; k++) pages.push(parts[k]);
        cur = [parts[parts.length - 1]];
        continue;
      }
    }
    cur.push(b);
  }
  if (cur.length) pages.push(cur.join(''));
  box.innerHTML = '';
  return pages;
}

function splitSentences(inner) {
  const parts = [];
  let buf = '', inTag = false;
  for (let i = 0; i < inner.length; i++) {
    const c = inner[i];
    buf += c;
    if (c === '<') { inTag = true; continue; }
    if (c === '>') { inTag = false; continue; }
    if (inTag) continue;
    if (/[。！？…!?]/.test(c)) {
      let j = i + 1;
      while (j < inner.length && /[”』」’）)\]】…。！？!?"'、]/.test(inner[j])) { buf += inner[j]; j++; }
      i = j - 1;
      parts.push(buf); buf = '';
    }
  }
  if (buf.trim()) parts.push(buf);
  return parts.length ? parts : [inner];
}

function splitBlock(html, box) {
  let pieces, wrap;
  const pm = html.match(/^<p([^>]*)>([\s\S]*)<\/p>$/);
  if (pm) {
    pieces = splitSentences(pm[2]);
    wrap = s => `<p${pm[1]}>${s}</p>`;
  } else {
    const lm = html.match(/^<(ul|ol)([^>]*)>([\s\S]*)<\/\1>$/);
    if (lm) {
      pieces = lm[3].match(/<li[\s\S]*?<\/li>/g) || [lm[3]];
      wrap = s => `<${lm[1]}${lm[2]}>${s}</${lm[1]}>`;
    } else return [html];
  }
  const res = [];
  let cur = '';
  for (const p of pieces) {
    box.innerHTML = wrap(cur + p);
    if (box.scrollHeight > box.clientHeight + 1 && cur) { res.push(wrap(cur)); cur = p; }
    else cur += p;
  }
  if (cur) res.push(wrap(cur));
  return res;
}

function buildPagedShots() {
  applyDensity();
  const md = $('md-input').value;
  const title = $('input-title').value.trim();
  const author = $('input-author').value.trim();
  const eyebrow = $('input-eyebrow').value.trim();
  const stat = statLine(md);
  const showNote = $('show-note').checked;
  const note = $('note-input').value.trim();
  const noteOnCover = showNote && note && $('opt-note-place').value === 'cover';
  const noteOwnPage = showNote && note && $('opt-note-place').value === 'page';
  const numStyle = $('opt-num-style').value;
  const numPos = $('opt-num-pos').value;
  const stamp = stampHTML();

  const bodyPages = [];
  splitByMarker(md).forEach(seg => bodyPages.push(...paginateSegment(seg)));
  const total = bodyPages.length;
  const shots = [];

  if ($('opt-cover').checked && (title || author || eyebrow || noteOnCover)) {
    let h = '<div class="cover-mid">';
    if (eyebrow) h += `<div class="cover-eyebrow">${esc(eyebrow)}</div>`;
    if (title) h += `<div class="cover-title">${esc(title)}</div>`;
    h += '<div class="cover-rule"></div>';
    if (author) h += `<div class="cover-author">${esc(author)}</div>`;
    if (stat) h += `<div class="meta-line">${esc(stat)}</div>`;
    if (noteOnCover) h += `<div class="cover-note">${nl2br(note)}</div>`;
    h += '</div>';
    if ($('show-date').checked) h += `<div class="cover-date">${dateStr('.')}</div>`;
    h += stamp;
    shots.push({ type: 'page', cls: 'page is-cover', label: '扉页', suffix: '扉页', html: h });
  }

  if (noteOwnPage) {
    shots.push({
      type: 'page', cls: 'page is-inner', label: '备注页', suffix: '备注',
      html: `<div class="note-head">备 注</div><div class="note-text">${nl2br(note)}</div>` + stamp,
    });
  }

  bodyPages.forEach((body, i) => {
    const n = i + 1;
    const txt = (NUM_STYLES[numStyle] || NUM_STYLES.pad)(n, total);
    let foot;
    if (numPos === 'split') {
      foot = `<div class="page-foot pos-split"><span class="foot-title">${esc(title || author || '')}</span><span>${txt}</span></div>`;
    } else if (txt) {
      foot = `<div class="page-foot pos-${numPos}"><span>${txt}</span></div>`;
    } else {
      foot = '<div class="page-foot"></div>';
    }
    shots.push({
      type: 'page', cls: 'page is-inner', label: `正文 ${n}`,
      suffix: String(n).padStart(2, '0'),
      html: `<div class="page-body">${body}</div>${foot}` + stamp,
    });
  });

  return shots;
}

/* ===================== 渲染 ===================== */
function rebuild() {
  applyDensity();
  document.body.classList.toggle('indent', $('opt-indent').checked);

  const md = $('md-input').value;
  $('char-count').textContent = countText(md).toLocaleString('en-US') + ' 字';

  SHOTS = currentMode === 'paged' ? buildPagedShots() : buildFlowShots();
  document.body.classList.toggle('single-shot', SHOTS.length <= 1);

  const flow = $('flow-list'), grid = $('pages-grid');
  flow.innerHTML = ''; grid.innerHTML = '';
  const host = currentMode === 'paged' ? grid : flow;

  if (!SHOTS.length) {
    host.innerHTML = '<div class="empty-state">粘贴正文后，这里会显示将要导出的每一张图。</div>';
    $('out-summary').textContent = '';
    $('out-summary').className = 'hint';
    return;
  }

  SHOTS.forEach((s, i) => {
    const cell = document.createElement('div');
    cell.className = s.type === 'page' ? 'page-cell' : 'flow-cell';
    const thumbCls = s.type === 'page' ? 'page-thumb' : 'card-thumb';
    cell.innerHTML = `
      <div class="${thumbCls}">
        <div class="${s.cls} shot${currentTheme === 'dark' ? ' dark' : ''}" data-idx="${i}">${s.html}</div>
      </div>
      ${SHOTS.length > 1 ? `<div class="shot-meta"><span>${s.label}</span><button type="button">下载</button></div>` : ''}
    `;
    const btn = cell.querySelector('button');
    if (btn) btn.onclick = () => exportOne(i);
    host.appendChild(cell);
  });

  layoutThumbs();
  summarize();
}

function summarize() {
  const el = $('out-summary');
  el.className = 'hint';
  if (currentMode === 'paged') {
    const body = SHOTS.filter(s => s.label.startsWith('正文')).length;
    el.textContent = `共 ${SHOTS.length} 张（正文 ${body} 页）`;
    if (SHOTS.length > 18) {
      el.className = 'hint warn';
      el.textContent += ' · 超过 18 张，可切到「紧凑」密度';
    }
    return;
  }
  const heights = [...document.querySelectorAll('.card-thumb .shot')].map(e => e.offsetHeight);
  const tallest = Math.max(0, ...heights);
  el.textContent = SHOTS.length > 1
    ? `共 ${SHOTS.length} 段 · 最高一张 ${tallest}px`
    : `一张长图 · ${tallest}px`;
  if (tallest > 8000) {
    el.className = 'hint warn';
    el.textContent += currentMode === 'long'
      ? ' · 过高可能导出失败，建议切到「自由分页」'
      : ' · 过高可能在手机上导出失败';
  }
}

function layoutThumbs() {
  document.querySelectorAll('.card-thumb, .page-thumb').forEach(t => {
    const w = t.clientWidth;
    const el = t.querySelector('.shot');
    if (!w || !el) return;
    const natural = t.classList.contains('page-thumb') ? PAGE_W : CARD_W;
    if (w >= natural - 1) {
      el.style.transform = '';
      t.style.height = '';
      return;
    }
    const s = w / natural;
    el.style.transform = `scale(${s})`;
    t.style.height = (el.offsetHeight * s) + 'px';
  });
}

function scheduleRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuild, 240);
}

/* ===================== 导出 ===================== */
function fileBase() {
  const title = $('input-title').value.trim() || '长图';
  const n = new Date();
  const p = v => String(v).padStart(2, '0');
  return `${title}_${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}`;
}

function fileName(i) {
  const s = SHOTS[i].suffix;
  return fileBase() + (s ? '_' + s : '') + '.png';
}

async function shotCanvas(idx) {
  const src = document.querySelector(`.shot[data-idx="${idx}"]`);
  const holder = $('export-holder');
  const clone = src.cloneNode(true);
  clone.style.transform = 'none';
  holder.innerHTML = '';
  holder.appendChild(clone);
  const canvas = await html2canvas(clone, { scale: 2, useCORS: true, backgroundColor: null, logging: false });
  holder.innerHTML = '';
  return canvas;
}

function setBusy(on) {
  document.querySelectorAll('.btn-generate, .btn-secondary').forEach(b => b.disabled = on);
}

function download(href, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = href;
  a.click();
}

async function exportSingle() { await exportOne(0); }

async function exportOne(idx) {
  if (!SHOTS.length) return showToast('还没有可导出的内容');
  setBusy(true); showToast('生成中…', 60000);
  try {
    const canvas = await shotCanvas(idx);
    download(canvas.toDataURL('image/png'), fileName(idx));
    showToast('已下载 ' + (SHOTS[idx].label || '图片'));
  } catch (e) { showToast('生成失败：' + e.message, 3000); }
  setBusy(false);
}

async function exportZip() {
  if (!SHOTS.length) return showToast('还没有可导出的内容');
  setBusy(true);
  try {
    const zip = new JSZip();
    for (let i = 0; i < SHOTS.length; i++) {
      showToast(`打包中 ${i+1}/${SHOTS.length}`, 60000);
      const canvas = await shotCanvas(i);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      zip.file(fileName(i), blob);
    }
    const content = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(content);
    download(url, fileBase() + '_分页.zip');
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast(`已打包 ${SHOTS.length} 张`);
  } catch (e) { showToast('打包失败：' + e.message, 3000); }
  setBusy(false);
}

async function exportSequential() {
  if (!SHOTS.length) return showToast('还没有可导出的内容');
  setBusy(true);
  try {
    for (let i = 0; i < SHOTS.length; i++) {
      showToast(`生成中 ${i+1}/${SHOTS.length}`, 60000);
      const canvas = await shotCanvas(i);
      download(canvas.toDataURL('image/png'), fileName(i));
      await new Promise(r => setTimeout(r, 450));
    }
    showToast(`已下载 ${SHOTS.length} 张`);
  } catch (e) { showToast('下载失败：' + e.message, 3000); }
  setBusy(false);
}

/* ===================== 文本工具 ===================== */
function withText(fn, msg) {
  const el = $('md-input');
  el.value = fn(el.value);
  rebuild();
  if (msg) showToast(msg);
}

function stripMarkdown() {
  withText(text => {
    const kept = [];
    text = text.replace(/\\([\\`*_{}\[\]()#+\-.!~>])/g, (m, c) => {
      kept.push(c);
      return '\uE000' + (kept.length - 1) + '\uE001';
    });
    text = text.replace(/```[\s\S]*?```/g, '');
    text = text.replace(/^ {0,3}#{1,6}[ \t]+/gm, '');
    text = text.replace(/^ {0,3}>[ \t]?/gm, '');
    text = text.replace(/^ {0,3}[-*+][ \t]+/gm, '');
    text = text.replace(/^ {0,3}\d+[.)][ \t]+/gm, '');
    text = text.replace(/!\[[^\]]*\]\([^)]*\)/g, '');
    text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
    text = text.replace(/(\*\*\*|___)([\s\S]+?)\1/g, '$2');
    text = text.replace(/(\*\*|__)([\s\S]+?)\1/g, '$2');
    text = text.replace(/\*(?!\s)([^*\n]+?)\*/g, '$1');
    try {
      text = text.replace(/(?<![A-Za-z0-9_])_(?!\s)([^_\n]+?)_(?![A-Za-z0-9_])/g, '$1');
    } catch (e) {
      text = text.replace(/(^|[^A-Za-z0-9_])_(?!\s)([^_\n]+?)_(?![A-Za-z0-9_])/g, '$1$2');
    }
    text = text.replace(/~~([\s\S]+?)~~/g, '$1');
    text = text.replace(/`([^`\n]+?)`/g, '$1');
    text = text.replace(/^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/gm, '');
    text = text.replace(/\uE000(\d+)\uE001/g, (m, i) => kept[+i]);
    text = text.replace(/\n{3,}/g, '\n\n');
    return text.trim();
  }, '已去除 Markdown 语法');
}

function halfWidthPunct() {
  withText(text => text
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/\u3000/g, ' ')
    .replace(/（/g, '(').replace(/）/g, ')')
    .replace(/【/g, '[').replace(/】/g, ']')
    .replace(/〔/g, '(').replace(/〕/g, ')')
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2018\u2019]/g, "'")
  , '全角括号、引号、字母数字已转为半角');
}

function tidyPunct() {
  withText(text => {
    text = text.replace(/\r\n?/g, '\n');
    text = text.replace(/^[ \t\u3000]+/gm, '');
    text = text.replace(/[ \t\u3000]+$/gm, '');
    text = text.replace(/[ \t]{2,}/g, ' ');
    text = text.replace(/。{3,}|\.{3,}|·{3,}/g, '……');
    text = text.replace(/…{3,}/g, '……');
    text = text.replace(/(?:^|[^…])…(?!…)/g, m => m.replace('…', '……'));
    text = text.replace(/[—―–]{2,}|[―–]/g, '——');
    text = text.replace(/—{3,}/g, '——');
    text = text.replace(/！{3,}/g, '！！');
    text = text.replace(/？{3,}/g, '？？');
    text = text.replace(/([，。；：、])\1+/g, '$1');
    text = text.replace(/([，。！？；：、）】》”’])[ \t]+/g, '$1');
    text = text.replace(/[ \t]+([，。！？；：、（【《“‘])/g, '$1');
    text = text.replace(/\n{3,}/g, '\n\n');
    return text.trim();
  }, '标点与空白已规范');
}

function spaceCJKLatin() {
  withText(text => text
    .replace(/([\u4e00-\u9fff\u3040-\u30ff])([A-Za-z0-9@#$%^&*])/g, '$1 $2')
    .replace(/([A-Za-z0-9!%^&*)\]}>])([\u4e00-\u9fff\u3040-\u30ff])/g, '$1 $2')
  , '中英文之间已补空格');
}

function copyAll() {
  navigator.clipboard.writeText($('md-input').value)
    .then(() => showToast('已复制到剪贴板'))
    .catch(() => showToast('复制失败，请手动选择'));
}

function clearText() { $('md-input').value = ''; rebuild(); }

function clearAll() {
  ['md-input','input-title','input-author','note-input','input-eyebrow','input-mark']
    .forEach(id => $(id).value = '');
  rebuild();
  showToast('已全部清空');
}

/* ===================== 手机端 tab / toast ===================== */
function switchTab(tab) {
  $('panel-edit').classList.toggle('tab-hidden', tab !== 'edit');
  $('panel-preview').classList.toggle('tab-hidden', tab !== 'preview');
  $('tab-edit').classList.toggle('active', tab === 'edit');
  $('tab-preview').classList.toggle('active', tab === 'preview');
  if (tab === 'preview') layoutThumbs();
}

let toastTimer = null;
function showToast(msg, ms = 1800) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ===================== 事件 ===================== */
['md-input','input-title','input-author','note-input','input-eyebrow','input-mark']
  .forEach(id => $(id).addEventListener('input', scheduleRebuild));

['show-date','opt-indent','opt-stat','opt-cover','opt-note-place','opt-num-style',
 'opt-num-pos','opt-density','opt-maxh'].forEach(id => $(id).addEventListener('change', rebuild));

$('show-note').addEventListener('change', function () {
  $('note-area').style.display = this.checked ? '' : 'none';
  rebuild();
});

$('show-mark').addEventListener('change', function () {
  $('mark-area').style.display = this.checked ? '' : 'none';
  rebuild();
});

['custom-a','custom-b'].forEach(id => $(id).addEventListener('input', () => {
  applyDeco();
  markActivePalette();
}));

window.addEventListener('resize', layoutThumbs);

/* 拖拽导入 */
const dropZone = $('md-input');
['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.add('dragover');
}));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
}));
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (!/\.(txt|md|markdown)$/i.test(f.name)) return showToast('只支持 .txt / .md');
  const r = new FileReader();
  r.onload = () => {
    dropZone.value = String(r.result);
    if (!$('input-title').value.trim()) $('input-title').value = f.name.replace(/\.[^.]+$/, '');
    rebuild();
    showToast('已导入 ' + f.name);
  };
  r.readAsText(f, 'utf-8');
});

/* ===================== 初始化 ===================== */
PALETTES = loadPalettes();
renderPalette();
applyDeco();
applyDensity();
rebuild();
</script>
